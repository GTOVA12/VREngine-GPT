name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cmake --preset windows
      - run: cmake --build --preset ${{ matrix.configuration }}
      - run: ctest --preset ${{ matrix.configuration }}
      - if: matrix.configuration == 'release'
        run: |
          cmake --install Build/windows --config Release --prefix Install
          .\Install\bin\FactoryCoreRuntime.exe --demo
          cpack --config Build/windows/CPackConfig.cmake -C Release -B Build/Packages
      - if: matrix.configuration == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FactoryCore-Windows
          path: Build/Packages/*.zip
          if-no-files-found: error
  portable-core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cmake -S . -B Build/linux -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DFACTORYCORE_ENABLE_SANITIZERS=ON
      - run: cmake --build Build/linux --parallel 2
      - run: ctest --test-dir Build/linux --output-on-failure
